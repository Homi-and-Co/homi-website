<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog · Homi & Co.</title>
<meta name="description" content="Plain-language thinking on running a small business: back offices, AI, and operations that actually work.">
<style>
  :root {
    --bg: #f4f2ec; --paper: #fbfaf6; --ink: #2b3125; --muted: #5c6258;
    --line: #d2d4ca; --accent: #75855c; --clay: #a4683f;
    --serif: "Newsreader", Georgia, serif; --sans: "Manrope", ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.75; }
  .shell { width: min(760px, calc(100% - 40px)); margin: 0 auto; }
  header.page { padding: 72px 0 8px; }
  header.page a.back { font-size: 13px; color: var(--muted); text-decoration: none; }
  header.page a.back:hover { color: var(--accent); }
  .post-date { color: var(--muted); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin: 18px 0 0; }
  h1 { font-family: var(--serif); font-weight: 500; letter-spacing: -.02em; font-size: clamp(36px, 5vw, 54px); line-height: 1.05; margin: 10px 0 34px; }
  h2 { font-family: var(--serif); font-weight: 500; font-size: 27px; margin: 46px 0 10px; letter-spacing: -.01em; }
  p { margin: 0 0 18px; }
  ul { padding-left: 22px; margin: 0 0 18px; }
  li { margin-bottom: 8px; }
  a { color: var(--clay); }
  .cta-box { margin: 52px 0 8px; padding: 30px 32px; background: var(--paper); border: 1px solid var(--line); border-top: 3px solid var(--clay); }
  .cta-box p { margin: 0 0 14px; font-family: var(--serif); font-size: 21px; line-height: 1.4; }
  .cta-box a.button { display: inline-block; padding: 13px 26px; background: var(--ink); color: #f4f2ec; text-decoration: none; font-size: 14px; font-weight: 600; letter-spacing: .02em; }
  .cta-box a.button:hover { background: var(--clay); }
  footer.page { border-top: 1px solid var(--line); margin-top: 64px; padding: 28px 0 72px; color: var(--muted); font-size: 13px; }
  footer.page a { color: var(--ink); }

  .post-thumb { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
  .post-row { display: grid; grid-template-columns: 150px 210px 1fr 30px; gap: 20px; align-items: start; padding: 30px 0; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); }
  .post-row:last-of-type { border-bottom: 1px solid var(--line); }
  .post-row:hover strong { color: var(--clay); }
  .post-row-date { color: var(--muted); font-size: 13px; padding-top: 4px; white-space: nowrap; }
  .post-row-main strong { display: block; font-family: var(--serif); font-weight: 500; font-size: 26px; letter-spacing: -.01em; line-height: 1.2; }
  .post-row-main span { display: block; margin-top: 8px; color: var(--muted); font-size: 15px; line-height: 1.6; }
  .post-row-arrow { color: var(--clay); font-size: 22px; padding-top: 2px; }
  .lede { color: var(--muted); font-size: 18px; margin: 0 0 44px; max-width: 560px; }
  @media (max-width: 640px) { .post-row { grid-template-columns: 1fr 30px; } .post-row-date { display: none; } }
</style>
</head>
<body>
<header class="page"><div class="shell">
  <a class="back" href="index.html">← Back to Homi & Co.</a>
  <h1>Blog</h1>
  <p class="lede">Plain-language thinking on running a small business: back offices, AI, and operations that actually work. New pieces weekly.</p>
</div></header>
<main><div class="shell">
    <p style="color:var(--muted);font-size:15px;">New pieces weekly. Next post drops September 29, 2026.</p>
</div></main>
<footer class="page"><div class="shell">
  <p>© 2026 Homi & Co. · <a href="index.html">Home</a> · <a href="homi-privacy-policy.html">Privacy Policy</a> · <a href="homi-terms-of-use.html">Terms of Use</a></p>
</div></footer>
</body>
</html>
